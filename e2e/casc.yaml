jenkins:
  systemMessage: "Vault JWT Secrets e2e — folder-driven config, no global block"
  numExecutors: 1
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: admin
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

unclassified:
  location:
    # The only instance-wide setting the plugin needs: a root URL Vault can reach to
    # fetch the OIDC discovery document. This is not Vault config — it is Jenkins' own URL.
    url: "http://jenkins:8080/"

  # NOTE: there is intentionally NO global `vaultJwtSecrets:` block here.
  # Vault connection settings (URL, role, mount, namespace) vary per team / per
  # namespace / per role, so they live on the team's FOLDER — see the job-dsl below.

credentials:
  system:
    domainCredentials:
      - credentials:
          # A Vault-backed string credential. It stores only path + field; the Vault
          # connection (URL, role, mount) is resolved from the folder of whatever job
          # uses it — here, team-a. In production you would scope this to the team folder.
          - vaultJwtSecret:
              scope: GLOBAL
              id: "team-a-db-password"
              description: "Vault JWT secret (resolves Vault via team-a folder config)"
              path: "production/db@secret"
              field: "password"

jobs:
  - script: |
      // The team's folder owns its Vault coordinates. Every job inside inherits them;
      // nothing about Vault is declared at the Jenkins-instance level.
      folder('team-a') {
        description('Team A — owns its Vault coordinates (URL, role, mount)')
        configure { node ->
          node / 'properties' / 'io.jenkins.plugins.vault__jwt__secrets.config.VaultJwtFolderProperty' {
            vaultUrl('http://vault:8200')
            role('e2e')
            defaultMount('secret')
          }
        }
      }
      pipelineJob('team-a/deploy') {
        definition {
          cps {
            sandbox(true)
            script('''
              pipeline {
                agent any
                stages {
                  stage('step-env') {
                    steps {
                      // No vaultUrl / role / mount here: all inherited from the team-a folder.
                      // A job that needed a different role would add role: '...' to override.
                      // GitLab's one-line notation: the last path segment is the field.
                      withVaultJwtSecrets(secrets: [
                        vaultSecret(path: 'production/db/password@secret', var: 'DB_PASSWORD'),
                        vaultSecret(path: 'production/db/apikey@secret',   var: 'API_FILE', type: 'file')
                      ]) {
                        sh 'echo "env secret is $DB_PASSWORD"'
                        sh 'echo "file holds: $(cat $API_FILE)"'
                      }
                    }
                  }
                  stage('gitlab-style-env') {
                    steps {
                      // GitLab configures Vault through CI/CD variables; the same names work here.
                      // VAULT_AUTH_ROLE overrides the role the team-a folder set.
                      withEnv(['VAULT_AUTH_ROLE=e2e-env']) {
                        withVaultJwtSecrets(secrets: [
                          vaultSecret(path: 'production/db/password@secret', var: 'PW2')
                        ]) {
                          sh 'echo "env-configured secret is $PW2"'
                        }
                      }
                    }
                  }
                  stage('raw-token') {
                    steps {
                      // The Jenkins analog of GitLab's `id_tokens:` — take the JWT itself and
                      // drive the Vault login by hand. Audience and role come from Jenkins env
                      // vars; ${VAULT_ADDR} is expanded when the token is minted.
                      withEnv(['VAULT_ADDR=http://vault:8200', 'VAULT_ROLE=e2e']) {
                        withVaultJwtToken(audience: '${VAULT_ADDR}') {
                          sh 'echo "raw token is $VAULT_ID_TOKEN"'
                          sh '/usr/local/bin/manual-vault-login.sh'
                        }
                      }
                    }
                  }
                  stage('credential') {
                    steps {
                      withCredentials([string(credentialsId: 'team-a-db-password', variable: 'PW')]) {
                        sh 'echo "credential secret is $PW"'
                      }
                    }
                  }
                }
              }
            '''.stripIndent())
          }
        }
      }
