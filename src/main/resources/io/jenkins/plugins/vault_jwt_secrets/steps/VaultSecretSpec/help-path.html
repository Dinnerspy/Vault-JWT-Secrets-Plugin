<div>
  KV v2 secret path in GitLab notation <code>path/to/secret@mount</code>. The <code>@mount</code> part is
  optional and defaults to the configured default mount. Example: <code>production/db@ops</code> reads
  <code>ops/data/production/db</code>. With no explicit <b>Field</b>, the last segment is read as the field
  name instead: <code>production/db/password@ops</code>.
</div>
