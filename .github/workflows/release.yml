name: Release

# Pushing a tag `vX.Y.Z` builds the plugin as version X.Y.Z and attaches the .hpi to a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      # The pom's version is ${changelist} (999999-SNAPSHOT by default); the tag supplies the real one.
      - name: Build and test
        run: |
          mvn -B -ntp \
            -Dchangelist="${GITHUB_REF_NAME#v}" \
            -DscmTag="$GITHUB_SHA" \
            -DgitHubRepo="$GITHUB_REPOSITORY" \
            verify
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" target/vault-jwt-secrets.hpi \
            --title "${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
